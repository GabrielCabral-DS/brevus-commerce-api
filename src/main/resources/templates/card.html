    <script>
        // --- 🌗 CONTROLE DE TEMA (DARK/LIGHT MODE) ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon?.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            themeToggleDarkIcon?.classList.remove('hidden');
        }

        themeToggleBtn?.addEventListener('click', function() {
            themeToggleDarkIcon?.classList.toggle('hidden');
            themeToggleLightIcon?.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });


        // --- 📦 CONTROLE DO MODAL DE PARCELAS ---
        const modal = document.getElementById('modal_parcelas');
        const fecharBtn = document.getElementById('fechar_modal');
        const definirParcelasBtn = document.getElementById('definir_parcelas');
        const opcoesParcelasSelect = document.getElementById('opcoes_parcelas');
        const inputParcelasOculto = document.getElementById('parcelas');
        const btnConfirmarPagamento = document.getElementById('confirmar_pagamento');

        function abrirModal() {
            modal?.classList.remove('hidden');
        }

        function fecharModal() {
            modal?.classList.add('hidden');
        }

        fecharBtn?.addEventListener('click', fecharModal);

        modal?.addEventListener('click', function(e) {
            if (e.target === modal) fecharModal();
        });

        definirParcelasBtn?.addEventListener('click', function() {
            if (opcoesParcelasSelect && inputParcelasOculto) {
                inputParcelasOculto.value = opcoesParcelasSelect.value;
                fecharModal();

                if (btnConfirmarPagamento) {
                    btnConfirmarPagamento.disabled = false;
                    btnConfirmarPagamento.classList.remove('cursor-not-allowed', 'bg-slate-300', 'dark:bg-slate-700', 'text-slate-500', 'dark:text-slate-400');
                    btnConfirmarPagamento.classList.add('bg-green-600', 'hover:bg-green-700', 'text-white');
                }
            }
        });

        window.abrirModalParcelas = abrirModal;
        window.fecharModalParcelas = fecharModal;


        // --- 💳 FUNÇÃO GLOBAL PARA ENVIAR O JSON (Chamada pelo script-cartao.js) ---
        window.dispararEnvioBackend = async function(btn) {
            const urlParams = new URLSearchParams(window.location.search);
            const saleId = urlParams.get('saleId');

            if (!saleId) {
                alert("ID da venda não encontrado na URL.");
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Confirmar Pagamento';
                }
                return;
            }

            const cart = JSON.parse(localStorage.getItem('brevus_cart')) || [];
            if (cart.length === 0) {
                alert("Seu carrinho está vazio.");
                return;
            }

            const itemsJson = cart.map(item => ({
                name: item.name,
                value: Math.round(Number(item.price) * 100), // Converte para centavos (Padrão Efí)
                amount: item.quantity
            }));

            const paymentToken = document.getElementById('payment_token').value;
            const installments = parseInt(document.getElementById('parcelas').value) || 1;

            if (!paymentToken) {
                alert("Erro: O Token de pagamento da Efí não foi preenchido.");
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Confirmar Pagamento';
                }
                return;
            }

            const billingAddress = {
                street: document.getElementById('rua').value,
                number: document.getElementById('numero').value,
                neighborhood: document.getElementById('bairro').value,
                zipcode: document.getElementById('cep').value.replace(/\D/g, ''),
                city: document.getElementById('cidade').value,
                state: document.getElementById('estado').value
            };

            const customerData = {
                name: document.getElementById('nome_cliente').value,
                cpf: document.getElementById('cpf').value.replace(/\D/g, ''),
                email: document.getElementById('email').value,
                phone_number: document.getElementById('telefone').value.replace(/\D/g, ''),
                birth: document.getElementById('nascimento').value,
                address: billingAddress
            };

            const payloadFinal = {
                items: itemsJson,
                payment: {
                    credit_card: {
                        payment_token: paymentToken,
                        installments: installments,
                        billing_address: billingAddress,
                        customer: customerData
                    }
                },
                metadata: {
                    custom_id: saleId
                }
            };


            try {
                const response = await AuthUtils.authenticatedFetch('/api/card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadFinal)
                });

                if (response.ok) {
                    localStorage.removeItem('brevus_cart'); // Sucesso! Limpa o carrinho.
                    window.location.href = `/api/web/success?saleId=${saleId}`;
                } else {
                    const errorTxt = await response.text();
                    throw new Error(errorTxt || "Falha no pagamento com o cartão.");
                }

            } catch (error) {
                console.error("Erro no processamento do cartão:", error);
                alert("Falha ao finalizar pedido: " + error.message);

                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Confirmar Pagamento';
                }
            }
        };


        // --- 🛒 RENDERIZAÇÃO DINÂMICA DO RESUMO DO PEDIDO ---
        function renderResumoPedido() {
            const cart = JSON.parse(localStorage.getItem('brevus_cart')) || [];
            const containerLista = document.getElementById('lista_itens_resumo');
            const badgeItens = document.getElementById('badge_itens');
            const valorTotalTexto = document.getElementById('valor_total_texto');
            const inputValorTotal = document.getElementById('valor_total');

            if (!containerLista) return;

            if (cart.length === 0) {
                containerLista.innerHTML = `<p class="text-sm text-slate-500 text-center py-4">Carrinho vazio.</p>`;
                if (badgeItens) badgeItens.textContent = "0 itens";
                if (valorTotalTexto) valorTotalTexto.textContent = "R$ 0,00";
                return;
            }

            const totalUnidades = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (badgeItens) {
                badgeItens.textContent = `${totalUnidades} ${totalUnidades === 1 ? 'item' : 'itens'}`;
            }

            let totalGeral = 0;

            containerLista.innerHTML = cart.map(item => {
                const precoUnitario = Number(item.price);
                const subtotal = precoUnitario * item.quantity;
                totalGeral += subtotal;

                return `
                    <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-700/30 p-3 rounded-lg">
                        <div class="flex items-center gap-3">
                            <img src="${item.imageUrl || 'https://via.placeholder.com/50'}" class="w-12 h-12 object-cover rounded-md border dark:border-slate-600">
                            <div>
                                <p class="font-bold text-slate-800 dark:text-white text-sm">${item.name}</p>
                                <p class="text-xs text-slate-500 dark:text-slate-400">${item.quantity}x R$ ${precoUnitario.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                            </div>
                        </div>
                        <span class="text-slate-700 dark:text-slate-300 font-bold text-sm">R$ ${subtotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</span>
                    </div>
                `;
            }).join('');

            if (valorTotalTexto) {
                valorTotalTexto.textContent = `R$ ${totalGeral.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            }

            if (inputValorTotal) {
                inputValorTotal.value = Math.round(totalGeral * 100);
            }
        }



        // 🚀 Carrega os itens do Macbook assim que abre
        document.addEventListener('DOMContentLoaded', () => {
            renderResumoPedido();
        });
    </script>
</body>
