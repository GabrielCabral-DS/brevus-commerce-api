<!DOCTYPE html>
<html lang="pt-br" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos | Brevus Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/auth-utils.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }

        if (!AuthUtils.isAuthenticated() || !AuthUtils.hasRole('CLIENT')) {
            window.location.href = '/api/web/login';
        }

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased min-h-screen">

<header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50 shadow-sm">

    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">

        <!-- ESQUERDA -->
        <div class="flex items-center gap-4">

            <!-- BOTÃO VOLTAR -->
            <button onclick="history.back()"
                    class="flex items-center gap-2 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-blue-600 transition">

                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                Voltar
            </button>

            <!-- LOGO -->
            <span class="text-xl font-bold text-slate-800 dark:text-white">
                    Brevus <span class="text-indigo-600">Commerce</span>
                </span>

        </div>

        <!-- CENTRO -->
        <div class="flex items-center gap-2">

            <i data-lucide="shopping-bag" class="w-5 h-5 text-blue-600"></i>

            <h1 class="font-bold text-sm uppercase tracking-widest text-slate-500 dark:text-slate-400">
                Meus Pedidos
            </h1>

        </div>

        <!-- DIREITA -->
        <div class="flex items-center gap-3">

            <!-- REFRESH -->
            <button id="refresh-btn"
                    onclick="loadOrders(currentPage)"
                    class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:ring-2 ring-blue-500 transition-all"
                    title="Atualizar pedidos">

                <i data-lucide="refresh-ccw" class="w-5 h-5 text-slate-700 dark:text-slate-300"></i>

            </button>

            <!-- DARK MODE -->
            <button id="theme-toggle"
                    class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:ring-2 ring-blue-500 transition-all">

                <i data-lucide="sun"
                   id="theme-toggle-light-icon"
                   class="hidden w-5 h-5 text-yellow-500"></i>

                <i data-lucide="moon"
                   id="theme-toggle-dark-icon"
                   class="w-5 h-5 text-slate-700 dark:text-blue-400"></i>

            </button>

            <!-- AVATAR -->
            <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:ring-2 ring-blue-500 transition">

                <i data-lucide="user" class="w-5 h-5"></i>

            </div>

        </div>

    </div>

</header>

<main class="max-w-6xl mx-auto px-4 py-8">

    <!-- Loading State -->
    <div id="loadingState" class="space-y-6">
        <div class="animate-pulse space-y-4">
            <div class="h-48 bg-slate-200 dark:bg-slate-800 rounded-3xl"></div>
            <div class="h-48 bg-slate-200 dark:bg-slate-800 rounded-3xl"></div>
            <div class="h-48 bg-slate-200 dark:bg-slate-800 rounded-3xl"></div>
        </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20">
        <div class="bg-slate-100 dark:bg-slate-900 w-24 h-24 rounded-3xl flex items-center justify-center mx-auto mb-8">
            <i data-lucide="package-open" class="w-12 h-12 text-slate-400"></i>
        </div>
        <h2 class="text-2xl font-bold mb-4 dark:text-white">Nenhum pedido encontrado</h2>
        <p class="text-slate-500 dark:text-slate-400 mb-8 max-w-md mx-auto">Você ainda não realizou nenhuma compra conosco. Que tal explorar nossos produtos?</p>
        <a href="/api/web/products-client" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-bold transition-all shadow-lg shadow-blue-600/30">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            Ir para a Loja
        </a>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden text-center py-20">
        <div class="bg-red-100 dark:bg-red-900/20 w-24 h-24 rounded-3xl flex items-center justify-center mx-auto mb-8">
            <i data-lucide="alert-circle" class="w-12 h-12 text-red-500"></i>
        </div>
        <h2 class="text-2xl font-bold mb-4 text-red-600 dark:text-red-400">Erro ao carregar pedidos</h2>
        <p class="text-slate-500 dark:text-slate-400 mb-8">Não foi possível carregar seus pedidos. Tente novamente.</p>
        <button onclick="loadOrders()" class="inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white px-8 py-4 rounded-xl font-bold transition-all">
            <i data-lucide="refresh-ccw" class="w-5 h-5"></i>
            Tentar Novamente
        </button>
    </div>

    <!-- Orders List -->
    <div id="ordersList" class="hidden space-y-6">
        <!-- Orders will be rendered here -->
    </div>

    <!-- Pagination -->
    <div id="pagination" class="hidden flex justify-center items-center gap-4 mt-12">
        <button id="prevPage" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg font-medium transition-all disabled:opacity-50 disabled:cursor-not-allowed">
            Anterior
        </button>
        <span id="pageInfo" class="text-sm text-slate-600 dark:text-slate-400">Página 1</span>
        <button id="nextPage" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg font-medium transition-all disabled:opacity-50 disabled:cursor-not-allowed">
            Próxima
        </button>
    </div>
</main>

<script>
    // Gerenciamento de Tema (Dark/Light Mode)
    const themeToggleBtn = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const lightIcon = document.getElementById('theme-toggle-light-icon');

    function updateThemeIcons() {
        const isDark = document.documentElement.classList.contains('dark');
        lightIcon.classList.toggle('hidden', !isDark);
        darkIcon.classList.toggle('hidden', isDark);
    }

    themeToggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('color-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        updateThemeIcons();
    });
    updateThemeIcons();

    // Estado Global da Aplicação
    let currentPage = 1;
    const itemsPerPage = 3;
    let isLoading = false;

    // Função Principal de Carga de Dados
    async function loadOrders(page = 1) {
        if (isLoading) return;
        isLoading = true;

        const userInfo = AuthUtils.getUserInfo();
        if (!userInfo || !userInfo.id) {
            showErrorState();
            isLoading = false;
            return;
        }

        showLoadingState();

        try {
            // Chamada para API (Ajuste de página para 0-based se necessário no back)
            const response = await AuthUtils.authenticatedFetch(`/api/sales/${userInfo.id}?page=${page}&size=${itemsPerPage}`);

            if (response.status === 401) {
                AuthUtils.logout();
                window.location.href = '/api/web/login';
                return;
            }

            if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);

            const data = await response.json();

            // ATUALIZAÇÃO DO ESTADO GLOBAL (Essencial para a paginação funcionar)
            currentPage = page;

            renderOrders(data.orders);
            updatePaginationControls(page, data.totalPages);
        } catch (error) {
            console.error('Erro ao carregar pedidos:', error);
            showErrorState();
        } finally {
            isLoading = false;
        }
    }

    // Gerenciamento de Interface (States)
    function showLoadingState() {
        document.getElementById('loadingState').classList.remove('hidden');
        document.getElementById('emptyState').classList.add('hidden');
        document.getElementById('errorState').classList.add('hidden');
        document.getElementById('ordersList').classList.add('hidden');
    }

    function showErrorState() {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
    }

    // Renderização da Lista de Pedidos
    function renderOrders(orders) {
        const list = document.getElementById('ordersList');
        const empty = document.getElementById('emptyState');

        document.getElementById('loadingState').classList.add('hidden');

        if (!orders || orders.length === 0) {
            list.classList.add('hidden');
            empty.classList.remove('hidden');
            return;
        }

        list.classList.remove('hidden');
        empty.classList.add('hidden');

        list.innerHTML = orders.map(order => {
            const hasPayment = order.payment !== null;
            const isPaid = order.status === 'PAID';

            return `
                <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden transition-all hover:shadow-lg">
                    <div class="p-6 border-b border-slate-50 dark:border-slate-800">
                        <div class="flex flex-wrap justify-between items-center gap-4">
                            <div class="flex items-center gap-4">
                                <div class="bg-blue-100 dark:bg-blue-900/30 p-3 rounded-2xl">
                                    <i data-lucide="package" class="w-6 h-6 text-blue-600 dark:text-blue-400"></i>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Pedido</span>
                                        <span class="font-mono text-xs font-bold bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-full">#${order.id.substring(0, 8)}</span>
                                    </div>
                                    <p class="text-sm text-slate-500">${new Date(order.saleDate).toLocaleDateString('pt-BR')}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-black text-slate-800 dark:text-white">
                                    R$ ${order.totalAmount.toFixed(2).replace('.', ',')}
                                </div>
                                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold mt-1
                                    ${isPaid ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-300' : 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300'}">
                                    <div class="w-2 h-2 rounded-full ${isPaid ? 'bg-green-500' : 'bg-amber-500'}"></div>
                                    ${isPaid ? 'Pago via ' + (order.payment?.method || 'PIX') : 'Aguardando Pagamento'}
                                </div>
                            </div>
                        </div>
                        ${!hasPayment && order.status === 'PENDING' ? `
                            <div class="mt-4 p-4 bg-amber-50 dark:bg-amber-900/10 border border-amber-100 dark:border-amber-900/20 rounded-2xl flex justify-between items-center">
                                <p class="text-xs font-medium text-amber-800 dark:text-amber-400">Pagamento não identificado.</p>
                            </div>
                        ` : ''}
                    </div>

                    <div class="p-6 bg-slate-50/50 dark:bg-slate-800/20 border-b border-slate-50 dark:border-slate-800">
                        <div class="flex justify-between items-center relative mb-4">
                            <div class="absolute top-5 left-0 w-full h-1 bg-slate-200 dark:bg-slate-700 -z-0"></div>
                            <div class="absolute top-5 left-0 h-1 bg-blue-500 transition-all duration-700" style="width: ${getProgressWidth(order.deliveryStatus, isPaid)}%"></div>
                            ${['check', 'package', 'truck', 'home'].map((icon, index) => `
                                <div class="relative z-10 flex flex-col items-center gap-2">
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center transition-colors duration-500 ${getStepActive(index, order.deliveryStatus, isPaid) ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-200 dark:bg-slate-700 text-slate-400'}">
                                        <i data-lucide="${icon}" class="w-5 h-5"></i>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="p-6">
                        <div class="space-y-4">
                            ${order.items.map(item => `
                                <div class="flex items-center gap-4">
                                    <img src="${item.productImagePath}" class="w-14 h-14 object-cover rounded-2xl border border-slate-100 dark:border-slate-800" onerror="this.src='https://via.placeholder.com/60'">
                                    <div class="flex-1">
                                        <h4 class="text-sm font-bold dark:text-white">${item.productName}</h4>
                                        <p class="text-xs text-slate-500">${item.quantity} un • R$ ${item.unitPrice.toFixed(2).replace('.', ',')}</p>
                                    </div>
                                    <p class="font-bold text-sm text-slate-900 dark:text-white">R$ ${item.subtotal.toFixed(2).replace('.', ',')}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        lucide.createIcons();
    }

    // Helpers de Paginação e Status
    function updatePaginationControls(page, total) {
        const pagination = document.getElementById('pagination');
        document.getElementById('pageInfo').innerText = `Página ${page} de ${total}`;
        document.getElementById('prevPage').disabled = (page <= 1);
        document.getElementById('nextPage').disabled = (page >= total);
        pagination.classList.toggle('hidden', total <= 1);
    }

    function getProgressWidth(status, isPaid) {
        if (!isPaid) return 0;
        const widths = { 'PREPARANDO_PEDIDO': 33, 'ENVIADO': 66, 'ENTREGUE': 100 };
        return widths[status] || 0;
    }

    function getStepActive(stepIndex, status, isPaid) {
        if (stepIndex === 0) return isPaid;
        if (!isPaid) return false;
        const statusMap = { 'PREPARANDO_PEDIDO': 1, 'ENVIADO': 2, 'ENTREGUE': 3 };
        return statusMap[status] >= stepIndex;
    }

    // Event Listeners de Inicialização e Navegação
    document.addEventListener('DOMContentLoaded', () => loadOrders(1));

    document.getElementById('prevPage').addEventListener('click', () => {
        if (currentPage > 1) loadOrders(currentPage - 1);
    });

    document.getElementById('nextPage').addEventListener('click', () => {
        loadOrders(currentPage + 1);
    });
</script>
</body>
</html>
